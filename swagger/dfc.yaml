                  dfc-b:references:
                    "@type": "@id"
                  dfc-b:referencedBy:
                    "@type": "@id"
                  dfc-b:offeres:
                    "@type": "@id"
                  dfc-b:supplies:
                    "@type": "@id"
                  dfc-b:defines:
                    "@type": "@id"
                  dfc-b:affiliates:
                    "@type": "@id"
                  dfc-b:manages:
                    "@type": "@id"
                  dfc-b:offeredThrough:
                    "@type": "@id"
                  dfc-b:hasBrand:
                    "@type": "@id"
                  dfc-b:hasGeographicalOrigin:
                    "@type": "@id"
                  dfc-b:hasClaim:
                    "@type": "@id"
                  dfc-b:hasAllergenDimension:
                    "@type": "@id"
                  dfc-b:hasNutrimentDimension:
                    "@type": "@id"
                  dfc-b:hasPhysicalDimension:
                    "@type": "@id"
                  dfc:owner:
                    "@type": "@id"
                  dfc-t:hostedBy:
                    "@type": "@id"
                  dfc-t:hasPivot:
                    "@type": "@id"
                  dfc-t:represent:
                    "@type": "@id"
                dfc-b:stockLimitation: '3'
                dfc-b:sku: new-sku
  "/api/dfc/enterprise_groups/{enterprise_group_id}/affiliated_by":
    post:
      summary: Add enterprise to group
      parameters:
      - name: enterprise_group_id
        in: path
        required: true
        schema:
          type: string
      tags:
      - EnterpriseGroups::AffiliatedBy
      responses:
        '201':
          description: created
        '400':
          description: bad request
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              example:
                "@id": http://test.host/api/dfc/enterprises/10001
  "/api/dfc/enterprise_groups/{enterprise_group_id}/affiliated_by/{id}":
    delete:
      summary: Remove enterprise from group
      parameters:
      - name: enterprise_group_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - EnterpriseGroups::AffiliatedBy
      responses:
        '204':
          description: no content
        '401':
          description: unauthorized
  "/api/dfc/enterprise_groups":
    get:
      summary: List groups
      tags:
      - EnterpriseGroups
      responses:
        '200':
          description: successful
          content:
            application/json; charset=utf-8:
              examples:
                in DFC v1 format:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_1.16.0.json
                    "@id": http://test.host/api/dfc/enterprise_groups/60000
                    "@type": dfc-b:Enterprise
                    dfc-b:name: Sustainable Farmers
                    dfc-b:hasDescription: this is a group
                    dfc-b:affiliatedBy:
                    - http://test.host/api/dfc/enterprises/10001
                    - http://test.host/api/dfc/enterprises/10002
            application/ld+json; profile="dfc-v2"; charset=utf-8:
              examples:
                in DFC v2 format:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_2.0.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/enterprise_groups
                      "@type": ldp:Container
                      ldp:contains: http://test.host/api/dfc/enterprise_groups/60000
                    - "@id": http://test.host/api/dfc/enterprise_groups/60000
                      "@type": dfc-b:Organization
                      dfc-b:name: Sustainable Farmers
                      dfc-b:hasDescription: this is a group
  "/api/dfc/enterprise_groups/{id}":
    get:
      summary: Show groups
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - EnterpriseGroups
      responses:
        '200':
          description: successful
          content:
            application/json; charset=utf-8:
              examples:
                successful:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_1.16.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/enterprise_groups/60000
                      "@type": dfc-b:Enterprise
                      dfc-b:hasAddress: http://test.host/api/dfc/addresses/40000
                      dfc-b:name: Sustainable Farmers
                      dfc-b:hasDescription: this is a group
                      dfc-b:affiliatedBy:
                      - http://test.host/api/dfc/enterprises/10001
                      - http://test.host/api/dfc/enterprises/10002
                    - "@id": http://test.host/api/dfc/addresses/40000
                      "@type": dfc-b:Address
                      dfc-b:hasStreet: 8 Acres Drive
                      dfc-b:hasPostalCode: '20170'
                      dfc-b:hasCity: Herndon
                      dfc-b:hasCountry: http://publications.europa.eu/resource/authority/country/AUS
                      dfc-b:region: Victoria
  "/api/dfc/enterprises":
    get:
      summary: List enterprises
      tags:
      - Enterprises
      responses:
        '200':
          description: successful
          content:
            application/json; charset=utf-8:
              examples:
                with access to one enterprise:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_1.16.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/enterprises/10000
                      "@type": dfc-b:Enterprise
                      dfc-b:hasAddress: http://test.host/api/dfc/addresses/40000
                      dfc-b:hasPhoneNumber:
                        "@type": dfc-b:PhoneNumber
                        dfc-b:phoneNumber: 0404 444 000 200
                      dfc-b:email: hello@example.org
