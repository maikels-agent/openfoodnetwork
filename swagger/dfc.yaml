  "/api/dfc/events":
    post:
      summary: Create Event
      parameters: []
      tags:
      - Events
      responses:
        '400':
          description: bad request
          content:
            application/json; charset=utf-8:
              examples:
                with missing parameter:
                  value:
                    success: false
                    message: Missing parameter `enterpriseUrlid`
        '401':
          description: unauthorised
          content:
            application/json; charset=utf-8:
              examples:
                as normal user:
                  value:
                    success: false
                    message: You need to authenticate as authorised platform (client_id).
                as other platform:
                  value:
                    success: false
                    message: Your client_id is not authorised on this platform.
        '200':
          description: success
          content:
            application/json; charset=utf-8:
              examples:
                when some records fail:
                  value:
                    success: true
                    messages:
                    - 'http://some-id: Validation failed: Address address1 can''t
                      be blank, Address city can''t be blank, Address zipcode can''t
                      be blank, Name can''t be blank, Address is invalid, Permalink
                      can''t be blank'
                importing an empty list:
                  value:
                    success: true
      requestBody:
        content:
          application/json:
            schema:
              example:
                eventType: refresh
                enterpriseUrlid: https://api.beta.litefarm.org/dfc/enterprises/
                scope: ReadEnterprise
  "/api/dfc/enterprises/{enterprise_id}/offers/{id}":
    parameters:
    - name: enterprise_id
      in: path
      required: true
      schema:
        type: string
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show Offer
      tags:
      - Offers
      responses:
        '200':
          description: success
          content:
            application/json; charset=utf-8:
              examples:
                success:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_1.16.0.json
                    "@id": http://test.host/api/dfc/enterprises/10000/offers/10001
                    "@type": dfc-b:Offer
                    dfc-b:hasPrice:
                      "@type": dfc-b:Price
                      dfc-b:value: 19.99
                      dfc-b:hasUnit: dfc-m:AustralianDollar
                    dfc-b:stockLimitation: 5
    put:
      summary: Update Offer
      parameters: []
      tags:
      - Offers
      responses:
        '204':
          description: success
      requestBody:
        content:
          application/json:
            schema:
              example:
                "@context": https://www.datafoodconsortium.org
                "@id": http://test.host/api/dfc/enterprises/10000/offers/10001
                "@type": dfc-b:Offer
                dfc-b:hasPrice: 9.99
                dfc-b:stockLimitation: 7
  "/api/dfc/enterprises/{enterprise_id}/orders/{order_id}":
    parameters:
    - name: enterprise_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show Order
      parameters:
      - name: order_id
        in: path
        required: true
      tags:
      - Orders
      responses:
        '200':
          description: success
          content:
            application/json; charset=utf-8:
              examples:
                success:
                  value:
                    "@context": https://w3id.org/dfc/ontology/context/context_1.16.0.json
                    "@graph":
                    - "@id": http://test.host/api/dfc/enterprises/10000/orders/11000
                      "@type": dfc-b:Order
                      dfc-b:hasPart: http://test.host/api/dfc/enterprises/10000/orders/11000/OrderLines/10001
                      dfc-b:orderedBy: http://test.host/api/dfc/enterprises/10000
                      dfc-b:hasOrderStatus: dfc-v:Held
                    - "@id": http://test.host/api/dfc/enterprises/10000/orders/11000/OrderLines/10001
                      "@type": dfc-b:OrderLine
                      dfc-b:quantity: 1
                      dfc-b:concerns: http://test.host/api/dfc/enterprises/10000/offers/20001
                    - "@id": http://test.host/api/dfc/enterprises/10000/offers/20001
                      "@type": dfc-b:Offer
                      dfc-b:hasPrice:
                        "@type": dfc-b:Price
                        dfc-b:value: 19.99
                        dfc-b:hasUnit: dfc-m:AustralianDollar
                      dfc-b:stockLimitation: 0
                      dfc-b:offeredItem: http://test.host/api/dfc/enterprises/10000/supplied_products/20001
                    - "@id": http://test.host/api/dfc/enterprises/10000/supplied_products/20001
                      "@type": dfc-b:SuppliedProduct
                      dfc-b:name: Apple - 1g
                      dfc-b:description: Red
                      dfc-b:hasQuantity:
                        "@type": dfc-b:QuantitativeValue
                        dfc-b:hasUnit: dfc-m:Gram
                        dfc-b:value: 1.0
                      dfc-b:referencedBy: http://test.host/api/dfc/enterprises/10000/catalog_items/10001
                      dfc-b:isVariantOf: http://test.host/api/dfc/product_groups/90000
                      ofn:spree_product_id: 90000
                      ofn:spree_product_uri: http://test.host/api/dfc/enterprises/10000?spree_product_id=90000
                    - "@id": http://test.host/api/dfc/enterprises/10000/SalesSession/#
                      "@type": dfc-b:SaleSession
        '401':
          description: unauthorized
        '404':
